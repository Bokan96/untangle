<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0f172a">
    <meta name="description" content="Untangle the graph: drag the dots until no lines cross.">
    <title>Untangle</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cg stroke='%2338bdf8' stroke-width='2.5'%3E%3Cpath d='M7 8 25 24M7 24 25 8'/%3E%3C/g%3E%3Cg fill='%2338bdf8'%3E%3Ccircle cx='7' cy='8' r='4'/%3E%3Ccircle cx='25' cy='24' r='4'/%3E%3Ccircle cx='7' cy='24' r='4'/%3E%3Ccircle cx='25' cy='8' r='4'/%3E%3C/g%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="bar">
        <h1>Untangle</h1>
        <div class="size" role="group" aria-label="Number of dots">
            <button id="fewer" aria-label="Fewer dots">&minus;</button>
            <span class="size-label"><b id="size">8</b><span class="unit"> dots</span></span>
            <button id="more" aria-label="More dots">+</button>
        </div>
        <button id="new" class="primary">New</button>
    </header>

    <div class="stats">
        <span><b id="crossings">0</b> <span id="crossings-label">crossings</span></span>
        <span><b id="moves">0</b> <span id="moves-label">moves</span></span>
        <span><b id="time">0.0</b>s</span>
        <label class="toggle"><input type="checkbox" id="hints" checked> Show crossings</label>
    </div>

    <main id="board">
        <svg id="graph" aria-label="Puzzle board">
            <g id="links"></g>
            <g id="nodes"></g>
        </svg>
        <p id="hint">Drag the dots until no lines cross</p>
        <div id="win" role="status" hidden>
            <p><strong>Untangled!</strong> <span id="win-stats"></span></p>
            <button id="next" class="primary">Next</button>
        </div>
    </main>

    <script src="game.js"></script>
</body>

</html>
